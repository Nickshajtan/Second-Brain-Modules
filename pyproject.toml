[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages/python"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
include = ["tools/**/*.py", "tests/**/*.py", "packages/python/**/*.py", "pyproject.toml"]
extend-exclude = ["packages/python/generated"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.format]
line-ending = "lf"
